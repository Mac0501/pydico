workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - validate
  - build
  - verify
  - publish
  - release
  # Disabled until GitHub publishing is enabled:
  # - mirror
  # - github-release

variables:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv_cache"
  UV_LINK_MODE: "copy"
  UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.uv-python"

default:
  image: "ghcr.io/astral-sh/uv:0.12.19-debian-slim"
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
      prefix: "uv-${PYTHON_VERSION}"
    paths:
      - .uv_cache/
      - .uv-python/
    policy: pull-push
  before_script:
    - uv python install "$PYTHON_VERSION"
    - uv sync --python "$PYTHON_VERSION" --frozen
  after_script:
    - uv cache prune --ci

quality:
  stage: validate
  needs: []
  script:
    - uv run black --check src tests examples
    - uv run isort --check-only src tests examples
    - uv run pyright

test:
  stage: validate
  needs: []
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.13"
          - "3.14"
  script:
    - mkdir -p reports
    - uv run pytest -q --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit.xml

build:
  stage: build
  needs:
    - job: quality
      artifacts: false
    - job: test
      artifacts: false
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        test "$CI_COMMIT_TAG" = "v$(uv version --short)"
      fi
    - uv build --no-sources
    - sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
  artifacts:
    name: "pydico-${CI_COMMIT_REF_SLUG}"
    expire_in: 1 week
    paths:
      - dist/

package_verify:
  stage: verify
  needs:
    - job: build
      artifacts: true
  script:
    - sha256sum --check dist/SHA256SUMS
    - uv run twine check dist/*.whl dist/*.tar.gz
    - uv run --isolated --no-project --with ./dist/pydico-*.whl python -c "import pydico"
    - uv run --isolated --no-project --with ./dist/pydico-*.tar.gz python -c "import pydico"

create_version_tag:
  stage: release
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq
    - apt-get install --yes --no-install-recommends git
    - uv python install "$PYTHON_VERSION"
    - uv sync --python "$PYTHON_VERSION" --frozen
  script:
    - test -n "$RELEASE_TOKEN" || (echo "RELEASE_TOKEN is not configured." >&2; exit 1)
    - git config user.name "pydico release bot"
    - git config user.email "release-bot@pydico.invalid"
    - git fetch --tags origin
    - git checkout -B "$CI_DEFAULT_BRANCH" "$CI_COMMIT_SHA"
    - OLD_HEAD="$(git rev-parse HEAD)"
    - uv run semantic-release version --no-push --no-vcs-release
    - |
      if [ "$(git rev-parse HEAD)" = "$OLD_HEAD" ]; then
        echo "No releasable change found."
        exit 0
      fi
    - NEW_TAG="$(git tag --points-at HEAD --sort=-version:refname | head -n 1)"
    - test -n "$NEW_TAG" || (echo "Semantic Release did not create a tag." >&2; exit 1)
    - git remote add release-origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push --push-option=ci.skip release-origin "HEAD:${CI_DEFAULT_BRANCH}"
    - git push release-origin "refs/tags/${NEW_TAG}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish_gitlab:
  stage: publish
  interruptible: false
  needs:
    - job: build
      artifacts: true
    - job: package_verify
      artifacts: false
  variables:
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
  script:
    - uv run twine upload --non-interactive --repository-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi" dist/*.whl dist/*.tar.gz
  rules:
    - if: '$CI_COMMIT_TAG'

