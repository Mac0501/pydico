create_gitlab_release:
  stage: release
  image: "registry.gitlab.com/gitlab-org/cli:v1.58.0"
  interruptible: false
  cache: []
  before_script: []
  after_script: []
  needs:
    - job: publish_gitlab
      artifacts: false
    # Re-enable together with the publish_pypi job:
    # - job: publish_pypi
    #   artifacts: false
  script:
    - echo "Creating GitLab release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "pydico $CI_COMMIT_TAG"
    description: "CHANGELOG.md"
    assets:
      links:
        # Re-enable together with public PyPI publishing:
        # - name: "PyPI"
        #   url: "https://pypi.org/project/pydico/"
        - name: "GitLab package registry"
          url: "$CI_PROJECT_URL/-/packages"
  rules:
    - if: '$CI_COMMIT_TAG'

